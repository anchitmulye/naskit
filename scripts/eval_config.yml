# eval_config.yaml — unified final evaluation configuration
#
# All paths are relative to naskit/ root.
# Each model entry defines exactly what to evaluate and how.
#
# Run:
#   conda run -n pointmlp python evaluate.py
#   conda run -n pointmlp python evaluate.py --models fashion_mnist pointnet_c40
#   conda run -n pointmlp python evaluate.py --dry-run

# ── Global eval settings ─────────────────────────────────────────────────────
eval:
  warmup:      10     # ORT warmup runs (discarded)
  runs:        100    # ORT timed runs — P50 = median latency
  num_threads: 4      # ORT intra_op_num_threads — set to physical core count

# ── Models ───────────────────────────────────────────────────────────────────
models:

  fashion_mnist:
    base_onnx:   models/fashion_mnist/fashion_mnist.onnx
    nas_onnx:    models/fashion_mnist/fashion_mnist_h3dnas.onnx
    dataloader:
      module:    submodules/h3dnas/examples/fashion_mnist/datamodule.py
      class:     FashionMNISTDataModule
      args:
        seed: 105
    class_names:
      - T-shirt/top
      - Trouser
      - Pullover
      - Dress
      - Coat
      - Sandal
      - Shirt
      - Sneaker
      - Bag
      - Ankle boot
    results_name: final_eval
    notes: Fashion MNIST 

  pointnet:
    base_onnx:   models/pointnet/pointnet_cls_c40_n1024.onnx
    nas_onnx:    models/pointnet/pointnet_cls_c40_n1024_h3dnas.onnx
    dataloader:
      module:    submodules/h3dnas/examples/pointnet/datamodule.py
      class:     ModelNetDataModule
      args:
        data_root:   submodules/vision-onnx-models/submodules/pointnet_pointnet2/data/modelnet40_normal_resampled
        model_repo:  submodules/vision-onnx-models/submodules/pointnet_pointnet2
        num_classes: 40
        seed:        105
    results_name: final_eval
    notes: PointNet 

  pointnet2:
    base_onnx:   models/pointnet2/pointnet2_cls_ssg_c40_n1024.onnx
    nas_onnx:    models/pointnet2/pointnet2_cls_ssg_c40_n1024_h3dnas.onnx
    dataloader:
      module:    submodules/h3dnas/examples/pointnet2/datamodule.py
      class:     ModelNetDataModule
      args:
        data_root:   submodules/vision-onnx-models/submodules/pointnet_pointnet2/data/modelnet40_normal_resampled
        model_repo:  submodules/vision-onnx-models/submodules/pointnet_pointnet2
        num_classes: 40
        seed:        105
    results_name: final_eval
    notes: PointNet++ SSG

  pointmlp:
    base_onnx:   models/pointmlp/pointmlp_c40_n1024.onnx
    nas_onnx:    models/pointmlp/pointmlp_c40_n1024_h3dnas.onnx
    dataloader:
      module:    submodules/h3dnas/examples/pointmlp/datamodule.py
      class:     PointMLPDataModule
      args:
        pointmlp_dir: submodules/vision-onnx-models/submodules/pointmlp/classification_ModelNet40
        seed: 105
    results_name: final_eval
    notes: PointMLP 

  mobilenet_v2:
    base_onnx:   submodules/h3dnas/examples/mobilenet/mobilenet_v2.onnx
    nas_onnx:    artifacts/mobilenet_v2/paper_run/models/best_finetuned.onnx
    dataloader:
      module:    submodules/h3dnas/examples/mobilenet/datamodule.py
      class:     ImageNetDataModule
      args:
        val_dir:      submodules/h3dnas/examples/mobilenet/data/imagenet/val
        eval_samples: 10000
        batch_size:   16
        seed:         105
    results_name: final_eval
    notes: MobileNetV2 two-stage evolutionary Stage 1 finetuned paper result