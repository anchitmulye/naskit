# Details about every base model in models/base/ comes from.
#
#   python models/scripts/fetch_models.py --list            what is present and verified
#   python models/scripts/fetch_models.py                   download every missing url entry
#   python models/scripts/fetch_models.py NAME|CATEGORY...  selected entries (build scripts are run for these)
#   python models/scripts/fetch_models.py --verify          re-hash every present file
#   python models/scripts/fetch_models.py --record CATEGORY updates hash 
#
# Each entry: file models/base/<name>.onnx, its sha256 and size, and one source:
#   url:    pinned download (ONNX Model Zoo at commit c5cae0f, Hugging Face at a revision)
#   run:    a script that builds the file ({out} = the target file, {scripts} = models/scripts,
#           {root} = the naskit folder; -m modules run from submodules/h3dnas)
#   local:  built here earlier with no public copy; keep the file (sha256 below)
# A rebuilt file can differ byte-wise from the recorded one (training, library
# versions); fetch.py reports it, and results recorded with the old file stay tied to its sha256.

